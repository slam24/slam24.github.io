<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"

  <body>

      <img src="./img/logo.avif" class="w-60" alt="" />
      <div class="text-center">
        <nav
          id="menu"
          class="hidden md:flex items-center space-x-6 font-semibold"

            <button class="flex items-center space-x-1">

              <a href="#" class="block px-4 py-2 hover:bg-gray-100"

              <a href="#" class="block px-4 py-2 hover:bg-gray-100"

              >

          <a href="#" class="hover:underline">Us</a>

      </div>

      <div class="flex flex-row space-x-4">
        <button id="menu-btn" class="block flex items-center space-x-4">
          <i class="fas fa-globe text-gray-700 text-l"></i>
          EN
        </button>
        <button class="rounded-3xl bg-cyan-500 text-black py-2 px-8">

      </div>

    <main></main>

    <footer></footer>
